version: '3'

services:
  pilates-app:
    build: .
    container_name: pilates-app
    ports:
      - "5051:5051"
    env_file:
      - .env
    volumes:
      # 1. Lie votre dossier NAS au conteneur pour voir vos modifs en direct
      - /volume1/docker/site-pilates:/app
      # 2. Empêche votre dossier NAS d'écraser les modules installés dans l'image
      - /app/node_modules
    restart: always
    extra_hosts:
      - "coolz-nas5:host-gateway"